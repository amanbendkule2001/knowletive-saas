services:
  db:
    image: postgres:18-alpine
    container_name: knowletive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowletive
      POSTGRES_PASSWORD: knowletive
      POSTGRES_DB: knowletive
    ports:
      - "5544:5432"
    volumes:
      - knowletive_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowletive -d knowletive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowletive_pgdata:
